# Small-run overrides for pilots. Compose with a model YAML via CLI:
#   --config sft_babylm_10m.yaml  and pass these via --max-steps / merge.
# Or: train_sft.py --config sft_pilot.yaml --model ... (see extends).
extends: sft_babylm_10m.yaml
run_name: pilot
num_train_epochs: 2
logging_steps: 5
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
